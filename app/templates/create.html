{% extends 'base.html' %}

{% block content %}
<div class="container">
    <div class="card" style="max-width: 600px; margin: 2rem auto;">
        <h2>Start New Project</h2>
        <p>Enter the details for your new ranking project.</p>
        
        <form action="{{ url_for('main.new_project') }}" method="POST" enctype="multipart/form-data">
            <div class="form-group">
                <label for="name">Project Name</label>
                <input type="text" id="name" name="name" required placeholder="e.g., Q4 Roadmap">
            </div>
            
            <div class="form-group">
                <label for="description">Description (Optional)</label>
                <textarea id="description" name="description" placeholder="Briefly describe the goal..."></textarea>
            </div>

            <div class="form-group">
                <label for="created_at">Date</label>
                <input type="date" id="created_at" name="created_at" value="{{ today }}" required>
            </div>
            
            <div class="form-group">
                <label for="file">Tasks CSV File</label>
                <input type="file" id="file" name="file" accept=".csv" required>
                <small style="display: block; margin-top: 0.5rem; color: var(--text-secondary);">
                    CSV must have 'id' and 'description' columns.
                </small>
            </div>
            
            <div class="form-actions" style="display: flex; gap: 1rem; margin-top: 2rem;">
                <button type="submit" class="btn btn-create" style="flex: 1;">Create Project</button>
                <a href="{{ url_for('main.index') }}" class="btn btn-abort" style="flex: 1; text-align: center; text-decoration: none;">Abort</a>
            </div>
        </form>
    </div>
</div>
{% endblock %}
